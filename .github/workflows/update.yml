name: Update Latest Version

on:
  schedule:
    - cron: "*/10 * * * *"  # This cron expression runs every 10 minutes

jobs:
  update_version:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Git
      - name: Set up Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # Step 3: Get the latest release information from Modrinth API
      - name: Fetch latest release information from Modrinth
        id: fetch_release
        run: |
          # Fetch the latest version info from Modrinth
          latest_release=$(curl -s https://api.modrinth.com/v2/project/knights-and-castles/version)

          # Extract the latest version and URL for the most recent version
          latest_version=$(echo $latest_release | jq -r '.[0].version_number') # Latest version
          latest_url=$(echo $latest_release | jq -r '.[0].files[0].url') # Download URL for latest version

          # Output the version and URL for later steps
          echo "::set-output name=latest_version::$latest_version"
          echo "::set-output name=latest_url::$latest_url"

      # Step 4: Create the update.json file
      - name: Create update.json
        run: |
          echo "{
            \"latest\": {
              \"version\": \"${{ steps.fetch_release.outputs.latest_version }}\",
              \"url\": \"${{ steps.fetch_release.outputs.latest_url }}\"
            }
          }" > update.json

      # Step 5: Commit and push the update.json file
      - name: Commit and push update.json
        run: |
          git add update.json
          git commit -m "Update to latest version"
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/gamerbenyt/KNC-json-update-URL.git HEAD:main
