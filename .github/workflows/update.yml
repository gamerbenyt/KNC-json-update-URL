name: Update Versions

on:
  push:
    branches:
      - main

jobs:
  update_versions:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Git
      - name: Set up Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # Step 3: Modify the update.json file (just an example of file modification)
      - name: Update versions in update.json
        run: |
          echo '{"release": "1.0.0", "beta": "1.0.4.1", "alpha": "1.0.4.3+alpha"}' > update.json

      # Step 4: Commit and push changes using the custom token
      - name: Commit and push changes
        run: |
          git add update.json
          git commit -m "Update to latest versions"
          git push https://x-access-token:${{ secrets.GH_CUSTOM_TOKEN }}@github.com/gamerbenyt/KNC-json-update-URL.git HEAD:main
