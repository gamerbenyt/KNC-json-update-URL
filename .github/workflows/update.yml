name: Update Latest Version

on:
  schedule:
    - cron: "*/6 * * * *"  # This cron expression runs every 6 minutes
  workflow_dispatch:  # This allows manual trigger via GitHub UI
  push:
    paths:
      - ".github/workflows/*"  # Triggers when the workflow YAML files are modified

jobs:
  update_version:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Git
      - name: Set up Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # Step 3: Get the latest release information from Modrinth API
      - name: Fetch latest release information from Modrinth
        id: fetch_release
        run: |
          # Fetch the latest version info from Modrinth
          latest_release=$(curl -s https://api.modrinth.com/v2/project/knights-and-castles/version)

          # Extract the latest version and URL for the most recent version
          latest_version=$(echo $latest_release | jq -r '.[0].version_number') # Latest version
          latest_url=$(echo $latest_release | jq -r '.[0].files[0].url') # Download URL for latest version

          # Output the version and URL for later steps
          echo "::set-output name=latest_version::$latest_version"
          echo "::set-output name=latest_url::$latest_url"

      # Step 4: Clear the update.json file
      - name: Clear update.json file
        run: |
          # Clear the existing update.json file (if any)
          echo "{}" > update.json  # Empty the JSON content

      # Step 5: Save the cleared update.json
      - name: Save cleared update.json
        run: |
          echo "{}" > update.json  # Ensure it's saved as an empty JSON object

      # Step 6: Update the update.json file with the latest version info
      - name: Update update.json with latest version info
        run: |
          echo "{
            \"latest\": {
              \"version\": \"${{ steps.fetch_release.outputs.latest_version }}\",
              \"url\": \"${{ steps.fetch_release.outputs.latest_url }}\"
            }
          }" > update.json  # Overwrite the file with the latest data

      # Step 7: Save the updated update.json file
      - name: Save updated update.json
        run: |
          echo "{
            \"latest\": {
              \"version\": \"${{ steps.fetch_release.outputs.latest_version }}\",
              \"url\": \"${{ steps.fetch_release.outputs.latest_url }}\"
            }
          }" > update.json  # Ensure the file is saved with updated content

      # Step 8: Commit and push the updated update.json file
      - name: Commit and push update.json
        run: |
          git add update.json
          git commit --allow-empty -m "Update to latest version"
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/gamerbenyt/KNC-json-update-URL.git HEAD:main
